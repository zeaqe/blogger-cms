name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

   # 2. Setup Gradle secara resmi (Akan otomatis membaca versi dari proyek atau menggunakan versi stabil)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 3. Build APK langsung menggunakan gradle (tanpa perlu perintah 'gradle wrapper' manual)
    - name: Build Debug APK
      run: gradle assembleDebug
      
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
    # Otomatis unggah APK ke GitHub Releases (Aktif jika menggunakan tag v*)
    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          app/build/outputs/apk/release/app-release.apk
        body: |
          Blogger CMS
          - Fitur: Release.
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
